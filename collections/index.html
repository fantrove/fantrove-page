    @media (prefers-reduced-motion: reduce) { #fv-boot-loader .fv-boot-arc { animation: none; } }

  <!-- Collection page script — loads collection data and renders items -->
  <script>
    (function() {
      'use strict';

      // Get collection ID from URL path: /collections/{id}/ → extract {id}
      var pathParts = window.location.pathname.replace(/\/+$/, '').split('/');
      var collectionId = pathParts[pathParts.length - 1] || '';

      if (!collectionId) {
        document.getElementById('collection-title').textContent = 'Collection not found';
        return;
      }

      // Wait for ConDataService to be available
      function waitForService(cb) {
        if (window.ConDataService) return cb();
        var poll = setInterval(function() {
          if (window.ConDataService) { clearInterval(poll); cb(); }
        }, 100);
        setTimeout(function() { clearInterval(poll); }, 10000);
      }

      function resolveName(nameObj, lang) {
        if (!nameObj || typeof nameObj !== 'object') return String(nameObj || '');
        return nameObj[lang] || nameObj.en || nameObj.th || Object.values(nameObj)[0] || '';
      }

      waitForService(function() {
        var lang = localStorage.getItem('selectedLang') || 'en';

        // Fetch collection data
        var svc = window.ConDataService;
        svc.getAssembled().then(function(db) {
          // Find collection type
          var collectionType = (db.type || []).find(function(t) {
            return t.kind === 'collection' || t.id === 'collections';
          });
          if (!collectionType) {
            document.getElementById('collection-title').textContent = 'Collections not available';
            return;
          }

          // Find the specific collection
          var collection = (collectionType.category || []).find(function(c) {
            return c.id === collectionId;
          });

          if (!collection) {
            document.getElementById('collection-title').textContent = 'Collection not found';
            return;
          }

          // Render collection header
          document.getElementById('collection-title').textContent = resolveName(collection.name, lang);
          document.getElementById('collection-description').textContent = collection.description
            ? resolveName(collection.description, lang) : '';
          document.getElementById('collection-item-count').textContent =
            (collection.data || []).length + ' items';

          // Update page title
          document.title = resolveName(collection.name, lang) + ' — Fantrove';

          // Render items as buttons
          var itemsContainer = document.getElementById('collection-items');
          var items = collection.data || [];
          var fragment = document.createDocumentFragment();

          items.forEach(function(item) {
            var btn = document.createElement('button');
            btn.className = 'collection-item-btn';
            btn.textContent = item.text || '';
            btn.setAttribute('data-text', item.text || '');
            btn.setAttribute('data-api', item.api || '');
            btn.setAttribute('title', resolveName(item.name, lang));
            btn.addEventListener('click', function() {
              try {
                window.unifiedCopyToClipboard && window.unifiedCopyToClipboard({
                  text: item.text,
                  api: item.api || null,
                  type: 'button',
                  name: item.api || '',
                });
              } catch(e) { console.warn('Copy failed:', e); }
            });
            fragment.appendChild(btn);
          });

          itemsContainer.appendChild(fragment);

          // Hide boot loader
          var loader = document.getElementById('fv-boot-loader');
          if (loader) { loader.classList.add('fv-boot-hidden'); }
        }).catch(function(err) {
          console.error('Failed to load collection:', err);
          document.getElementById('collection-title').textContent = 'Error loading collection';
        });
      });
    })();
  </script>
