<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO tags — injected at build time -->
  <title data-translate="collection_title">Collection — Fantrove Verse</title>
  <meta name="description" data-translate="collection_description" content="">
  <meta name="robots" content="index, follow">

  <meta name="theme-color" content="#13b47f" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="icon" type="image/x-icon" href="/assets/images/fantrove-verse360.ico" />

  <!-- Design tokens (FIRST) -->
  <link rel="preload" href="/assets/css/tokens.css" as="style">
  <link rel="stylesheet" href="/assets/css/tokens.css">

  <!-- Common styles -->
  <link rel="stylesheet" href="/assets/css/bg.css">
  <link rel="stylesheet" href="/assets/css/back-to-top.css">

  <!-- Collection styles -->
  <link rel="preload" href="/assets/js/collection-service/collection-service.css" as="style" onload="this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/assets/js/collection-service/collection-service.css" /></noscript>

  <!-- Collection page specific CSS -->
  <link rel="stylesheet" href="/assets/css/collection.css">

  <style>
    html { background:#fff; }
    body { margin:0; opacity:1; }
    html, body { overscroll-behavior-y:none; -webkit-overflow-scrolling:touch; }
    .fv-sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  </style>
</head>

<body>
  <!-- SEO h1 (สำหรับ search engines — JS อาจ update content) -->
  <h1 id="collection-page-h1" class="fv-sr-only" data-translate="collection_sr_h1">Collection — Fantrove</h1>

  <main class="collection-page" id="collectionMain" role="main">

    <!-- ═══ Cover Section ═══ -->
    <section class="collection-cover-section" id="collectionCoverSection">
      <!-- COVER_HTML_PLACEHOLDER — replaced at build time -->
      <div id="collectionCover">
        <!-- Dynamic cover content injected by JS or build script -->
      </div>
    </section>

    <!-- ═══ Header Section ═══ -->
    <header class="collection-header" id="collectionHeader">
      <h2 class="collection-name" id="collectionName" data-translate="collection_name">Collection Name</h2>
      <p class="collection-description" id="collectionDescription" data-translate="collection_desc">Collection description goes here.</p>
      <p class="collection-item-count" id="collectionItemCount" data-translate="collection_count">0 items</p>
    </header>

    <!-- ═══ Items Grid ═══ -->
    <section class="collection-items" id="collectionItemsSection" aria-label="Collection items">
      <!-- ITEMS_HTML_PLACEHOLDER — replaced at build time -->
      <div id="collectionItems">
        <!-- Dynamic items content injected by JS or build script -->
      </div>
    </section>

    <!-- ═══ Related Collections ═══ -->
    <section class="collection-related" id="collectionRelatedSection" aria-label="Related collections">
      <h2 class="collection-related-title" id="collectionRelatedTitle" data-translate="collection_related_title">Related Collections</h2>
      <!-- RELATED_HTML_PLACEHOLDER — replaced at build time -->
      <div class="collection-related-grid" id="collectionRelated">
        <!-- Dynamic related content injected by JS or build script -->
      </div>
    </section>

    <!-- ═══ Back Navigation ═══ -->
    <nav class="collection-back" id="collectionBackNav">
      <a href="/home/" data-translate="collection_back_home">← Back to Home</a>
    </nav>

  </main>

  <!-- Language system -->
  <script src="/assets/js/lang-proxy.js"></script>
  <script src="/assets/js/lang-sync.js"></script>
  <script src="/assets/js/lang-core.js"></script>
  <script src="/assets/js/language.js"></script>

  <!-- ConDataService (item resolution) -->
  <script type="module" src="/assets/js/con-data-service/con-data-service.js"></script>

  <!-- Collection Service -->
  <script defer src="/assets/js/collection-service/collection-service.js"></script>

  <!-- Copy notification -->
  <script defer src="/assets/js/copyNotification.js"></script>

  <!-- Back to top -->
  <script defer src="/assets/js/back-to-top.js"></script>
</body>
</html>
