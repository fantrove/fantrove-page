  <!--
    [FIX 2026-07-28]
    ไฟล์นี้เป็น FALLBACK เท่านั้น — ปกติ production build ใช้ _redirects rule
    `/ /en/home/ 200` ส่ง content ของ home page มาที่ URL `/` โดยตรง (URL rewrite)
    ไฟล์ index.html นี้จะถูกใช้เฉพาะ:
      1. dev mode (เปิดผ่าน Cloudflare Pages โดยไม่ build) — _redirects จะ
         rewrite / ไปที่ /home/index.html อยู่แล้ว ไฟล์นี้จึงไม่ถูกเสิร์ฟที่ /
      2. direct access ผ่าน /index.html โดยตรง — กรณีนี้ใช้ meta refresh
         ส่งไป /home/ แบบ no-JS-friendly
      3. เป็น catch-all 404 fallback ผ่าน _redirects `/* /index.html 200`
         (dev) — ในกรณีนี้ควรแสดงเป็น 404 page

    SEO:
      - canonical ชี้ไป /en/home/ (canonical URL ของหน้าแรกจริง)
      - ลบ noindex เพื่อให้ Google เข้าใจว่าหน้านี้คือ duplicate ของ
        /en/home/ ไม่ใช่ redirect → Google จะ index canonical URL
      - meta refresh 0s สำหรับ user ที่เข้าตรง /index.html (no-JS fallback)
  -->

  <!--
    Meta refresh fallback (0s) — ใช้เฉพาะตอนที่ user เข้า /index.html ตรงๆ
    โดยที่ _redirects rule ไม่ทำงาน (เช่น static file server อื่น).
    Googlebot มอง meta refresh 0s เป็น redirect แต่ยัง index canonical URL
    จาก <link rel="canonical"> ด้านบนได้ — ดีกว่า noindex + ไม่มีทางออก
  -->
  <meta http-equiv="refresh" content="0; url=/home/" />
